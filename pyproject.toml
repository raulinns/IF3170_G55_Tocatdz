[project]
name = "if3170-tubes1"
version = "0.1.0"
description = "local search implementation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "plotly>=5.24",
    "streamlit>=1.65",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
if3170 = "if3170_tubes1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/if3170_tubes1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
